<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/dash.css">
    <script src="./js/sessao.js"></script>
    <title>Noites brancas</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="Gerencimentopagina"
    onload="validarSessao(),KpiTotalUsuarios(),usuariosAtivos(),usuariosinativos(),obterDadosGrafico(),GraficoAtividadeUsuario()">
    <aside class="sidebar">

        <div class="sidebar-logo">
            <img class="logo" src="./assets/logo.png" alt="Logo do Sistema">
        </div>
        <nav>
            <ul>
                <li>
                    <a href="dashboard.html">Gereciamento do Quiz </a>
                    <a href="gereciamento.html" class="ativo"> Gerencimento de usuarios </a>
                </li>
        </nav>

        <button class="btn-logout" onclick="limparSessao()">
            Sair
        </button>

    </aside>

    <main class="conteudomain">



        <div class="filtro">

        <select id="select_mes">
            <option value="todos">Todos</option>
            <option value="1">Janeiro</option>
            <option value="2">Fevereiro</option>
            <option value="3">Março</option>
            <option value="4">Abril</option>
            <option value="5">Maio</option>
            <option value="6">Junho</option>
        </select>

          <button  class="btn_filtrar"onclick="filtrarMes()">Filtrar</button>

        </div>

        <div class="container-kpis">
            <div class="card-kpi">
                <p> Total de Usuários cadastrados no sistema em maio de 2026</p>
                <span id="span_usuarios"></span>
            </div>

            <div class="card-kpi">
                <p>
                    Total de Usuários ativos no sistema em maio de 2026
                </p>
                <span id="span_ativos"></span>
            </div>
            <div class="card-kpi">
                <p> Total de Usuários inativos no sistema em maio de 2026</p>
                <span id="span_inativos"></span>
            </div>



        </div>

        <div class="grafico-container">

            <div class="grafico-card">
                <canvas id="graficoUsuarios"></canvas>
            </div>

            <div class="grafico-card">
                <canvas id="graficoStatus"></canvas>
            </div>
        </div>

    </main>



    <script>



        let grafico;
        let proximaAtualizacao;
        let dadosOriginais = [];


        function filtrarMes() {

            const mesSelecionado = select_mes.value;

            const dadosFiltrados = dadosOriginais.filter(item => {

                const data = new Date(item.dataCadastro);

                return data.getMonth() + 1 == mesSelecionado;
            });

            organizarSemanas(dadosFiltrados);
        }




        function organizarSemanas(dados) {

            let semana1 = 0;
            let semana2 = 0;
            let semana3 = 0;
            let semana4 = 0;
            let semana5 = 0;

            for (let i = 0; i < dados.length; i++) {

                const data = new Date(dados[i].dataCadastro);

                const dia = data.getDate();

                if (dia <= 7) {
                    semana1++;

                } else if (dia <= 14) {
                    semana2++;

                } else if (dia <= 21) {
                    semana3++;

                } else if (dia <= 28) {
                    semana4++;

                } else {
                    semana5++;
                }
            }

            atualizarGrafico([
                semana1,
                semana2,
                semana3,
                semana4,
                semana5
            ]);
        }
        function KpiTotalUsuarios() {

            fetch("/usuarios/buscarTotalUsuarios")
                .then(resposta => resposta.json())
                .then(dados => {

                    span_usuarios.innerHTML = dados[0].totalUsuarios;

                });

        }
        function usuariosAtivos() {

            fetch("/usuarios/usuariosAtivos")
                .then(resposta => resposta.json())

                .then(dados => {

                    console.log(dados);

                    document.getElementById("span_ativos").innerHTML = dados[0].usuariosAtivos;

                });

        }
        function usuariosinativos() {
            fetch("/usuarios/usuariosInativos")
                .then(resposta => resposta.json())
                .then(dados => {

                    console.log(dados);

                    document.getElementById("span_inativos").innerHTML = dados[0].usuariosInativos;

                });
        }


        function obterDadosGrafico() {




            if (proximaAtualizacao != undefined) {
                clearTimeout(proximaAtualizacao);
            }

            fetch(`/usuarios/dadosGrafico`, { cache: 'no-store' })
                .then(function (response) {
                    if (response.ok) {
                        response.json().then(function (resposta) {
                            console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);

                            plotarGrafico(resposta);

                        });
                    } else {
                        console.error('Nenhum dado encontrado ou erro na API');
                    }
                })
                .catch(function (error) {
                    console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
                });
        }
        function atualizarGrafico(valores) {

            grafico.data.labels = [
                "Semana 1",
                "Semana 2",
                "Semana 3",
                "Semana 4",
                "Semana 5"
            ];

            grafico.data.datasets[0].data = valores;

            grafico.update();
        }

        function plotarGrafico(resposta) {

            console.log('iniciando plotagem do gráfico...');

            dadosOriginais = resposta;

            const canvas = document.getElementById("graficoUsuarios");

            grafico = new Chart(canvas, {

                type: 'bar',

                data: {

                    labels: [
                        "Semana 1",
                        "Semana 2",
                        "Semana 3",
                        "Semana 4",
                        "Semana 5"
                    ],

                    datasets: [{

                        label: 'Usuários cadastrados',

                        data: [0, 0, 0, 0, 0],

                        backgroundColor: '#00184b',
                        borderColor: '#FFFFFF',
                        borderWidth: 2

                    }]
                }
            });

            organizarSemanas(resposta);
        }

        function GraficoAtividadeUsuario() {

            fetch(`/usuarios/usuariosAtivos`)
                .then(resposta => resposta.json())

                .then(respostaAtivos => {

                    let ativos = respostaAtivos[0].usuariosAtivos;

                    fetch(`/usuarios/usuariosInativos`)
                        .then(resposta => resposta.json())

                        .then(respostaInativos => {

                            let inativos = respostaInativos[0].usuariosInativos;

                            const canvas = document.getElementById("graficoStatus");

                            new Chart(canvas, {

                                type: 'pie',

                                data: {

                                    labels: ['Ativos', 'Inativos'],

                                    datasets: [{

                                        data: [ativos, inativos],

                                        backgroundColor: [
                                            '#1b263b',
                                            '#00184b'
                                        ],

                                        borderColor: '#ffffff',
                                        borderWidth: 2

                                    }]

                                },

                                options: {

                                    responsive: true,
                                    maintainAspectRatio: false,

                                    plugins: {

                                        title: {

                                            display: true,
                                            text: 'Cadastro de usuários por semana',

                                            color: '#00184b',

                                            font: {
                                                size: 25,
                                                family: 'Poppins',
                                                weight: 'bold'
                                            }

                                        },

                                        legend: {

                                            labels: {

                                                color: '#00184b',

                                                font: {
                                                    size: 15
                                                }

                                            }

                                        }

                                    },

                                    scales: {

                                        x: {

                                            ticks: {

                                                color: '#00184b'

                                            },

                                            grid: {

                                                color: 'rgba(255,255,255,0.1)'

                                            }

                                        },

                                        y: {

                                            beginAtZero: true,

                                            ticks: {

                                                color: '#00184b'

                                            },

                                            grid: {

                                                color: 'rgba(255,255,255,0.1)'

                                            }

                                        }

                                    }

                                }

                            });

                        });

                });

        }

    </script>
</body>

</html>
