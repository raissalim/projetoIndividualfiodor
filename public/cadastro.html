<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./css/style.css">
    <title>Noites brancas</title>
      <script src="./js/sessao.js"></script>
      <script src="./js/cadastrologin.js"></script>
</head>
<body class="cadastropagina" >

    <aside class="sidebar">

        <div class="sidebar-logo">
        <img class="logo" src="./assets/logo.png" alt="Logo do Sistema">
    </div>
        
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="autor.html">Autor</a></li>
                <li><a href="resumo.html">Resumo livro</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="Cadastro.html"class="ativo">Cadastro</a></li>

            </ul>       
        </nav>
    </aside>

    
    <main class="content">
       
        <div class="cadastro">
    

  <form>
     <h1>Cadastra-se</h1>
    <label>Nome:</label><br>
    <input type="text" id="nome" name="nome" placeholder="Seu nome" required><br><br>

    <label>Email:</label><br>
    <input type="email" id="email" name="email" placeholder="Seu email" required><br><br>


    <label>Senha:</label><br>
    <input type="password" id="senha"name="senha" placeholder="Minimo 8 caracteres "required  onfocus="mostrar()" onblur="esconder()">
<br><br>


    
    <label>Confirmar Senha:</label><br>
    <input type="password" id="confirmarsenha" name="confirmarsenha"placeholder="Confirmar senha" required><br><br>

    <button class="btncadastrar" type="button" onclick="chamarfunc()">Criar conta</button>
    <a class="aindanaotemlogin" href="login.html">Já possui cadastro?</a>
    <div id="mensagem"></div>

  </form>


<div id="card" style="display: none;">
        A senha precisa ter:
        <br>
        • 8 caracteres
        <br>
        • letra maiúscula
        <br>
       
        • letra minuscula
        <br>
          • um caractere especial
        <br>
        • número
    </div>
   

  

        </div>

         </main>
<script>
    function chamarfunc(){
        
      let cadastrar= cadastro(nome.value,email.value,senha.value,confirmarsenha.value);
           if(!cadastrar){
            mensagem.innerHTML="Erro ao  cadastrar!" ;
          }
          else{
            mensagem.innerHTML="Cadastrado com sucesso!";
          }

         
    }

    function mostrar() {
    card.style.display = "block";
}

function esconder() {
    card.style.display = "none";
}
</script>
        </body>
</html>
