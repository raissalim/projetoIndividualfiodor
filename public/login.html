</head>
<body class="paginalogin" >

    
   <aside class="sidebar">

        <img class="logo" src="./assets/logo.png" alt="Logo do Sistema">

    <main class="content">
       
        <div class="login">
    

  <form>
     <h1>Entrar</h1>
   

    <label>Email:</label><br>
    <input type="email" name="email" id="email" placeholder="Seu email" required><br><br>

    <label>Senha:</label><br>   
    <input type="password" name="senha" id="senha" placeholder="Minimo 8 caracteres "required><br><br>

    <div id="mensagem" ></div>
    <button class="btnlogin" type="button" onclick="chamarfunc()">Entrar</button>
    <a class="aindanaotemcadastro" href="Cadastro.html">Ainda não tem cadastro?</a>

    </form>
  

        </div>

        <script>
async function chamarfunc(){

    let Logar = await Login(email.value, senha.value);

    console.log(Logar);

    if(Logar){
        mensagem.innerHTML = "Login realizado com sucesso!";
    } else {
        mensagem.innerHTML = "Erro ao logar";
    }
}
        </script>

         </main>
</body>
